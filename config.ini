# Slurm Mailer Configuration
# Copy this file to config.ini and fill in your settings

[smtp]
# SMTP server configuration
host = smtp.gmail.com
port = 465
# Use SSL/TLS
tls = true
# SMTP authentication credentials
user = your-email@gmail.com
password = your-app-password

# Email settings
from = slurm-mailer@example.com
# Comma-separated list of recipients
to = admin@example.com, manager@example.com

[slurm]
# Set to a username to watch only that user's jobs.
# Leave empty to watch all users (requires appropriate Slurm permissions).
watch_user = 

# Set to true to watch all users' jobs (overrides watch_user)
watch_all_users = false

# How often to poll for job status changes (in seconds)
poll_interval_seconds = 30

# How long to aggregate status changes before sending an email (in minutes)
aggregation_minutes = 10
